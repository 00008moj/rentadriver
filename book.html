<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent A Driver</title>
    <link rel="shortcut icon" href="images/favicon-verstappen.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/scrollreveal" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

    <nav>
        <div class="brand-container">
            <h2 class="brand-title">RentADriver</h2>
        </div>
    
        <div class="link-container">
            <a href="index.html">Home</a>
            <a href="index.html">About</a>
            <a href="index.html">Drivers</a>
            <a href="index.html">Reviews</a>
        </div>
        <button class="book-button">Book A Driver</button>
    </nav>

    <main>
        <section id="contact" height="100vh">
            <div class="contact-header">
                <div>
                    <p class="header-label">BOOK A RIDE</p>
                    <h2>Let's Plan Your Trip.</h2>
                    <p>Fill in the details below to get started.</p>
                </div>
            </div>

            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="">
                <input type="hidden" name="subject" value="New Driver Booking">

                <div class="book-form">
                    <div class="full-name">
                        <label for="full-name" class="full-name">Full Name</label>
                        <input type="text" id="full-name" name="Full Name" placeholder="Enter your full name" required>
                    </div>

                    <div class="contact-number">
                        <label for="contact-number">Contact Number</label>
                        <input type="tel" id="contact-number" name="Contact Number" placeholder="Enter your contact number" required>
                    </div>

                    <div class="select-driver">
                        <label for="driver">Choose a Driver</label>
                        <select id="driver" name="Driver" required>
                            <option value="" disabled selected>Select a driver</option>
                            <option value="Max Verstappen">Max Verstappen</option>
                            <option value="Oscar Piastri">Oscar Piastri</option>
                            <option value="Charles Leclerc">Charles Leclerc</option>
                            <option value="Kimi Antonelli">Kimi Antonelli</option>
                            <option value="Lewis Hamilton">Lewis Hamilton</option>
                            <option value="Lando Norris">Lando Norris</option>
                        </select>
                    </div>

                    <div class="pickup-location">
                        <label for="pickup">Pickup Location</label>
                        <input type="text" id="pickup" name="Pickup Location" placeholder="Enter pickup location" required>
                    </div>

                    <div class="destination">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" name="Destination" placeholder="Enter destination" required>
                    </div>

                    <div class="booking-date">
                        <label for="booking-date">Date</label>
                        <input type="date" id="booking-date" required>
                    </div>

                    <button class="submit-button">Submit</button>
                </div>
            </form>
        </section>
    </main>

    <footer id="footer">
        <div class="footer">
            <h2>RentADriver</h2>
            <div class="social-icons">
                <a href="#"><i class="iconoir-facebook-tag"></i></a>
                <a href="#"><i class="iconoir-instagram"></i></a>
                <a href="#"><i class="iconoir-tiktok"></i></a>
                <a href="#"><i class="iconoir-telegram"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
